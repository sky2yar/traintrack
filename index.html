<!DOCTYPE html>

<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="theme-color" content="#101713">

<title>SKYFORM</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

:root{--bg:#101713;--panel:#1d2922;--sage:#91cda1;--silver:#c4c9c4;--muted:#89958d}

*{box-sizing:border-box}

body{margin:0;background:var(--bg);color:#f2f5f2;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:85px}

header{padding:25px 20px 15px;display:flex;justify-content:space-between;align-items:center}

.logo{font-size:25px;font-weight:900;letter-spacing:4px;color:var(--sage)}

.tagline{font-size:9px;letter-spacing:2px;color:var(--muted);margin-top:4px}

main{padding:0 16px;max-width:700px;margin:auto}

.page{display:none}.page.active{display:block}

h2{font-size:23px;margin:18px 0 14px}

h3{font-size:16px;margin:0 0 12px}

.card{background:var(--panel);border:1px solid #304137;border-radius:17px;padding:17px;margin:13px 0}
